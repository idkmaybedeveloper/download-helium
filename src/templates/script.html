    <script>
        var REV_URL = "$rev_url";

        var download = document.getElementById('download');
        download.addEventListener('click', function() {
            var logo = document.getElementById('logo');
            logo.classList.add('rotate');
            setTimeout(function() { logo.classList.remove('rotate'); }, 600);
        });

        var DURATION_IN_SECONDS = {
          epochs: ['year', 'month', 'day', 'hour', 'minute'],
          year:   31536000,
          month:  2592000,
          day:    86400,
          hour:   3600,
          minute: 60
        };

        function getDuration(seconds) {
          var epoch, interval;

          for (var i = 0; i < DURATION_IN_SECONDS.epochs.length; i++) {
            epoch = DURATION_IN_SECONDS.epochs[i];
            interval = Math.floor(seconds / DURATION_IN_SECONDS[epoch]);
            if (interval >= 1) {
              return { interval: interval, epoch: epoch };
            }
          }
        };

        function timeSince(date) {
          var seconds = Math.floor((new Date() - new Date(date)) / 1000);
          var duration = getDuration(seconds);
          if (!duration) {
            return 'just now';
          }
          var suffix = (duration.interval > 1 || duration.interval === 0) ? 's' : '';
          return duration.interval + ' ' + duration.epoch + suffix + ' ago';
        };

        if (window.fetch) {
            fetch(REV_URL).then( response => {
                if (response.status !== 200) {
                    return;
                }
                var msg = document.querySelector('small.rev');
                msg.style.opacity = 1;
                response.json().then( rev => {
                    var link = msg.querySelector('a');
                    link.textContent = rev.content;
                    link.href = "https://github.com/imputnet/helium/releases/tag/" + rev.content;
                    if (rev['last-modified']) {
                        msg.querySelector('span').textContent = '| Updated ' + timeSince(rev['last-modified']);
                    }
                });
            });
        }
    </script>
